name: Build Linux

on:
  push:
    branches: [ linux ]
  pull_request:
    branches: [ linux ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libglfw3-dev \
            libgl1-mesa-dev \
            libssl-dev \
            zlib1g-dev \
            nlohmann-json3-dev \
            libcurl4-openssl-dev \
            pkg-config

      - name: Build and install cpr
        run: |
          git clone https://github.com/libcpr/cpr.git --depth=1
          cd cpr
          mkdir build && cd build
          cmake .. \
            -DCPR_USE_SYSTEM_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build Dota2CFGChanger
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: Dota2CFGChanger-linux
          path: build/Dota2CFGChanger
          retention-days: 30