name: Build Windows

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManagerCPP
          path: build/Release/DotaManager.exe

      - name: Delete old latest release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dota2 CFG Changer — Latest Build"
          body: |
            ## 🪟 Последняя автосборка с ветки `main`

            ### Установка
            1. Скачай `DotaManager.exe`
            2. Запусти — установка не нужна
          files: build/Release/DotaManager.exe
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dota2 CFG Changer ${{ github.ref_name }} — Windows"
          body: |
            ## 🪟 Windows релиз ${{ github.ref_name }}

            ### Установка
            1. Скачай `DotaManager.exe`
            2. Разархивируй его в любую папку
            3. Открой, и выбери путь
            4. Нажми Scan
            5. После выбери аккаунты, и нажми Copy
            6. Profit
          files: build/Release/DotaManager.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}