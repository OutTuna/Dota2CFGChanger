name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "TODO.md"
      - "diagram.png"
  workflow_dispatch:
    inputs:
      force_major:
        description: "Force a major version bump (vX.Y -> v(X+1).0)"
        type: boolean
        default: false

# Two overlapping runs would race on tags / the "latest" release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        env:
          FORCE_MAJOR: ${{ inputs.force_major || 'false' }}
        run: bash scripts/compute-next-version.sh

  build-windows:
    needs: compute-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC & Resource Compiler
        uses: ilammy/msvc-dev-cmd@v1
      - name: Identify Windows toolchain
        id: toolchain
        shell: pwsh
        run: |
          $identity = "$env:VCToolsVersion|$env:ImageOS|$(cmake --version | Select-Object -First 1)"
          $hash = [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($identity))
          $key = [System.BitConverter]::ToString($hash).Replace('-', '').ToLowerInvariant()
          "id=$key" >> $env:GITHUB_OUTPUT
      - name: Cache dependency sources and builds
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_RC_COMPILER=rc -DDOTAMANAGER_BUILD_TESTS=ON -DAPP_VERSION=${{ needs.compute-version.outputs.version }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Regression tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Windows
          path: build/Release/DotaManager.exe
          if-no-files-found: error

  build-linux:
    needs: compute-version
    runs-on: ubuntu-latest
    env:
      # linuxdeploy and its plugin are themselves AppImages; runners have no
      # FUSE, so run them by self-extraction instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ccache \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libssl-dev \
            imagemagick

      - name: Identify Linux toolchain
        id: toolchain
        run: |
          id=$({ gcc --version; cmake --version; dpkg-query -W libssl-dev libgl1-mesa-dev; } | sha256sum | cut -d' ' -f1)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Cache dependency sources and builds
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ github.run_id }}
          restore-keys: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DDOTAMANAGER_BUILD_TESTS=ON -DAPP_VERSION=${{ needs.compute-version.outputs.version }}

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Regression tests
        run: |
          ctest --test-dir build --output-on-failure
          python3 tests/core_checks.py build/_deps/json-src/include

      - name: Compiler cache statistics
        run: ccache --show-stats

      - name: Download linuxdeploy + AppImage plugin
        run: |
          mkdir -p "$HOME/ld"
          base=https://github.com/linuxdeploy
          wget -q -O "$HOME/ld/linuxdeploy" \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          # linuxdeploy finds the plugin by this exact name on PATH
          wget -q -O "$HOME/ld/linuxdeploy-plugin-appimage" \
            "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x "$HOME/ld/"*
          echo "$HOME/ld" >> "$GITHUB_PATH"

      - name: Create AppImage
        run: |
          cat > dotamanager.desktop << 'EOF'
          [Desktop Entry]
          Name=Dota2 CFG Changer
          Comment=Copy Dota 2 configs between Steam accounts
          Exec=DotaManager
          Icon=dotamanager
          Type=Application
          Categories=Utility;
          EOF

          # Real app icon; solid-colour fallback so packaging never fails on this.
          convert "Icon.ico[0]" -resize 256x256 dotamanager.png 2>/dev/null \
            || convert -size 256x256 xc:blue dotamanager.png

          mkdir -p AppDir/usr/bin
          cp build/DotaManager AppDir/usr/bin/

          linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/DotaManager \
            --desktop-file dotamanager.desktop \
            --icon-file dotamanager.png \
            --output appimage

          mkdir -p linux-artifact
          mv ./*.AppImage linux-artifact/
          ls -la linux-artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Linux
          path: linux-artifact/*.AppImage
          if-no-files-found: error

  release:
    needs: [compute-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Tag and release
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          APPIMAGE_FILE=$(find DotaManager-Linux -name "*.AppImage" -type f | head -n1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: AppImage not found"
            ls -la DotaManager-Linux/
            exit 1
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

          # --cleanup-tag also removes the old "latest" git tag, otherwise the
          # new release would stay pinned to a stale commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest Build ($VERSION)" \
            --prerelease \
            --notes "Automated build $VERSION from commit $GITHUB_SHA" \
            DotaManager-Windows/DotaManager.exe \
            "$APPIMAGE_FILE"
