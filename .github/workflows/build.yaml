name: Build Windows

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC & Resource Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create Resource File with Icon
        shell: powershell
        run: |
          Set-Content -Path app_resource.rc -Value 'IDI_ICON1 ICON "icon.ico"' -Encoding ASCII

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_RC_COMPILER=rc

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManagerCPP
          path: build/Release/DotaManager.exe

      - name: Delete old latest release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dota2 CFG Changer — Latest Build"
          body: |
            ## 🪟 Последняя автосборка с ветки `main`
            ### Установка
            1. Скачай `DotaManager.exe`
            2. Запусти — установка не нужна
          files: build/Release/DotaManager.exe
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dota2 CFG Changer ${{ github.ref_name }} — Windows"
          body: |
            ## 🪟 Windows релиз ${{ github.ref_name }}
            ### Установка
            1. Скачай `DotaManager.exe`
            2. Запусти — установка не нужна
          files: build/Release/DotaManager.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
