name: Build Linux AppImage

on:
  push:
    branches: [ "linux" ] 
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      force_major:
        description: "Форсировать major-бамп (vX.0)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -e
          git fetch --tags --force

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*' | sort -V | tail -n1)

          if [ -z "$LAST_TAG" ]; then
            NEW_VERSION="v1.0"
            IS_MAJOR="false"
            echo "Тегов vX.Y ещё нет -- стартуем с $NEW_VERSION"
          else
            echo "Последний тег: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=%B || true)

            MAJOR_BUMP=false
            if [ "${{ github.event.inputs.force_major }}" = "true" ]; then
              MAJOR_BUMP=true
            fi
            if echo "$COMMITS" | grep -qi 'BREAKING CHANGE'; then MAJOR_BUMP=true; fi
            if echo "$COMMITS" | grep -qi '\[major\]'; then MAJOR_BUMP=true; fi
            if echo "$COMMITS" | grep -Eq '^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:'; then MAJOR_BUMP=true; fi

            VER="${LAST_TAG#v}"
            MAJOR="${VER%%.*}"
            MINOR="${VER##*.}"

            if [ "$MAJOR_BUMP" = true ]; then
              NEW_VERSION="v$((MAJOR + 1)).0"
              IS_MAJOR="true"
            else
              NEW_VERSION="v${MAJOR}.$((MINOR + 1))"
              IS_MAJOR="false"
            fi
          fi

          echo "Следующая версия: $NEW_VERSION (major:$IS_MAJOR)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_major=$IS_MAJOR"   >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential imagemagick file \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xorg-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp build/DotaManager AppDir/usr/bin/

          cat << 'EOF' > AppDir/usr/share/applications/Dota2CFGChanger.desktop
          [Desktop Entry]
          Type=Application
          Name=Dota2 CFG Changer
          Comment=Менеджер конфигов для Dota 2
          Exec=DotaManager
          Icon=dota2cfgchanger
          Terminal=false
          Categories=Game;Utility;
          EOF
          
          convert icon.ico[0] AppDir/usr/share/icons/hicolor/256x256/apps/dota2cfgchanger.png

      - name: Build AppImage using linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          
          chmod +x linuxdeploy*.AppImage
          export OUTPUT=Dota2CFGChanger-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/DotaManager \
            --desktop-file AppDir/usr/share/applications/Dota2CFGChanger.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/dota2cfgchanger.png \
            --output appimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManagerLinux
          path: Dota2CFGChanger-x86_64.AppImage

      - name: Delete old latest release
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rolling release (linux branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dota2 CFG Changer — Latest Linux Build (${{ steps.version.outputs.version }})"
          body: |
            ##Последняя автосборка с ветки `linux`

            Соответствует версии `${{ steps.version.outputs.version }}`.

            ### Установка (Linux)
            1. Скачай `Dota2CFGChanger-x86_64.AppImage`
            2. Выдай права на выполнение: `chmod +x Dota2CFGChanger-x86_64.AppImage`
            3. Запусти двойным кликом или через терминал
          files: Dota2CFGChanger-x86_64.AppImage
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create stable release (auto version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: >-
            ${{ steps.version.outputs.is_major == 'true'
                && format('Dota2 CFG Changer {0} — крупное обновление', steps.version.outputs.version)
                || format('Dota2 CFG Changer {0}', steps.version.outputs.version) }}
          generate_release_notes: true
          body: |
            ## Linux релиз ${{ steps.version.outputs.version }}

            ${{ steps.version.outputs.is_major == 'true' && 'Это major-версия: возможны несовместимые изменения относительно предыдущих релизов.' || '' }}

            ### Установка (Linux)
            1. Скачай файл `Dota2CFGChanger-x86_64.AppImage`
            2. Сделай его исполняемым:
               ```bash
               chmod +x Dota2CFGChanger-x86_64.AppImage
               ```
            3. Запусти! AppImage содержит в себе все нужные библиотеки.
          files: Dota2CFGChanger-x86_64.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
