name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "TODO.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "version=v1.0" >> "$GITHUB_OUTPUT"
          else
            VER="${LAST_TAG#v}"
            MAJOR="${VER%%.*}"
            MINOR="${VER##*.}"
            echo "version=v${MAJOR}.$((MINOR + 1))" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: compute-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC & Resource Compiler
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_RC_COMPILER=rc
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Windows
          path: build/Release/DotaManager.exe

  build-linux:
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev imagemagick
      
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release -j$(nproc)
      
      - name: Install AppImage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
      
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp build/DotaManager AppDir/usr/bin/
          
          cat > AppDir/usr/share/applications/dotamanager.desktop << 'EOF'
          [Desktop Entry]
          Name=Dota2 CFG Changer
          Comment=Copy Dota 2 configs between Steam accounts
          Exec=DotaManager
          Icon=dotamanager
          Type=Application
          Categories=Utility;
          EOF
          
          convert -size 256x256 xc:blue AppDir/usr/share/icons/hicolor/256x256/apps/dotamanager.png 2>/dev/null || true
          
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          echo "=== Files in current directory ==="
          ls -la *.AppImage 2>/dev/null || echo "No AppImage in current dir"
          find . -name "*.AppImage" -type f
          
          mkdir -p linux-artifact
          mv DotaManager*.AppImage linux-artifact/ 2>/dev/null || cp *.AppImage linux-artifact/ 2>/dev/null || echo "No AppImage found"
          
          # Показываем что переместили
          echo "=== linux-artifact contents ==="
          ls -la linux-artifact/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Linux
          path: linux-artifact/

  release:
    needs: [compute-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Show downloaded files
        run: |
          echo "=== Windows artifact ==="
          ls -la DotaManager-Windows/ 2>/dev/null || echo "Not found"
          echo "=== Linux artifact ==="
          ls -la DotaManager-Linux/ 2>/dev/null || echo "Not found"
          find DotaManager-Linux -name "*.AppImage" -type f 2>/dev/null || echo "No AppImage found"
      
      - name: Tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.compute-version.outputs.version }}"
          git push origin "${{ needs.compute-version.outputs.version }}"
          
          gh release delete latest --yes || true
          
          APPIMAGE_FILE=$(find DotaManager-Linux -name "*.AppImage" -type f | head -n1)
          
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: AppImage file not found in DotaManager-Linux/"
            ls -la DotaManager-Linux/
            exit 1
          fi
          
          echo "Uploading AppImage: $APPIMAGE_FILE"
          
          gh release create latest \
            --title "Latest Build (${{ needs.compute-version.outputs.version }})" \
            --prerelease \
            DotaManager-Windows/DotaManager.exe \
            "$APPIMAGE_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
