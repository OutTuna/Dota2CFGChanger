name: Build & Release

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "TODO.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: version
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "version=v1.0" >> "$GITHUB_OUTPUT"
          else
            VER="${LAST_TAG#v}"
            MAJOR="${VER%%.*}"
            MINOR="${VER##*.}"
            echo "version=v${MAJOR}.$((MINOR + 1))" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: compute-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -DCMAKE_RC_COMPILER=rc
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Windows
          path: build/Release/DotaManager.exe

  build-linux:
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglfw3-dev libgl1-mesa-dev libx11-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: DotaManager-Linux
          path: build/DotaManager

  release:
    needs: [compute-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.compute-version.outputs.version }}"
          git push origin "${{ needs.compute-version.outputs.version }}"
          gh release delete latest --yes || true
          gh release create latest \
            --title "Latest Build (${{ needs.compute-version.outputs.version }})" \
            --prerelease \
            DotaManager-Windows/DotaManager.exe \
            DotaManager-Linux/DotaManager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
